[project]
name = "code-rag"
version = "0.1.0"
description = "Cross-repo semantic code search & RAG: AST chunking, hybrid retrieval, symbol graph, citation-enforced answers."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.25",
    "tree-sitter-rust>=0.24",
    "qdrant-client>=1.15",
    "tantivy>=0.25",
    "ladybug>=0.22",
    "httpx>=0.27",
    "anthropic>=2.0",
    "langgraph>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "rich>=13.9",
    "arq>=0.26",
    "redis>=5.2",
    "langfuse>=3.0",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "pyyaml>=6.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[project.scripts]
code-rag = "code_rag.interfaces.cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires embedded stores (tantivy/ladybug) and optionally a Qdrant server",
]
addopts = "-ra"
norecursedirs = ["tests/fixtures", ".venv", "data"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["code_rag"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "tantivy.*",
    "ladybug.*",
    "kuzu.*",
    "tree_sitter_python.*",
    "tree_sitter_typescript.*",
    "tree_sitter_go.*",
    "tree_sitter_rust.*",
    "arq.*",
    "sentence_transformers.*",
    "langfuse.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "PT"]
# PLC0415: optional providers are imported lazily on purpose (profile-specific dependencies).
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018", "PLR0904"]
"src/code_rag/interfaces/worker/main.py" = ["RUF012"]
"scripts/**" = ["ASYNC240"]
