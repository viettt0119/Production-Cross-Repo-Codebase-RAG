# Production-like topology:
#   api    (N replicas, read-only: Qdrant + Tantivy reader + graph snapshots)  <- HTTP / SSE / webhooks
#   worker (exactly 1: single writer of ledger, Tantivy, graph)               <- Redis queue
#   qdrant (vectors), redis (jobs + per-repo locks)
x-app: &app
  build: .
  image: code-rag:latest
  env_file: [.env]
  environment: &app-env
    CODE_RAG_PROFILE: ${CODE_RAG_PROFILE:-cloud}
    CODE_RAG_QDRANT__URL: http://qdrant:6333
    CODE_RAG_REDIS_URL: redis://redis:6379/0
    CODE_RAG_CONFIG: /app/config/settings.${CODE_RAG_PROFILE:-cloud}.toml
  volumes:
    - data:/data
    - ./config:/app/config:ro
  depends_on:
    qdrant: { condition: service_started }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  api:
    <<: *app
    environment:
      <<: *app-env
      CODE_RAG_ROLE: api
    command: ["code-rag", "serve", "--host", "0.0.0.0", "--port", "8080", "--workers", "2"]
    ports: ["8080:8080"]

  worker:
    <<: *app
    environment:
      <<: *app-env
      CODE_RAG_ROLE: worker
    command: ["code-rag", "worker"]
    healthcheck:
      disable: true

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  data:
  qdrant:
  redis:
