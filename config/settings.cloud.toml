profile = "cloud"

[cloud]
code_embedding_model = "voyage-code-3"
summary_embedding_model = "voyage-3.5"
embedding_dim = 1024
rerank_model = "rerank-2.5"
summarizer_model = "claude-haiku-5-5"
expander_model = "claude-haiku-5-5"
judge_model = "claude-haiku-5-5"
synth_model = "claude-opus-5-5"
synth_effort = "medium"
enable_refusal_fallback = true
use_batches_for_bulk = true
summarizer_concurrency = 32

[retrieval]
dense_k = 40
bm25_k = 40
fused_k = 50
rerank_top_k = 10
graph_seeds = 8
graph_limit = 16
graph_min_confidence = 0.5
generated_penalty = 0.6
query_expansion = true
max_synthesis_attempts = 3
