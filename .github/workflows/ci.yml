name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Retrieval-quality gate (offline fixture benchmark)
        run: uv run python scripts/fixture_eval.py --profile offline --min-mrr 0.6
